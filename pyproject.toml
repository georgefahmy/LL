[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "learnedleague-tool"
version = "9.0.0"
description = "LearnedLeague Practice Tool & Analytics Suite (Unified Web + Desktop)"
readme = "README.md"
requires-python = ">=3.12.1"
authors = [{ name = "George Fahmy" }]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.3",
    "lxml>=6.1.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "cryptography>=43.0.0",
    "packaging>=24.0",
    "rapidfuzz>=3.10.0",
    "pandas>=2.2.0",
    "scipy>=1.14.0",
    "statsmodels>=0.14.0",
    "pillow>=13.0.0",
]

[project.optional-dependencies]
desktop = [
    "pywebview>=5.3",
    "keyring>=25.5.0",
    "pyinstaller>=6.11.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.21.0",
    "ruff>=0.7.0",
]

[tool.setuptools.packages.find]
include = ["backend*", "desktop*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"
