name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv run --no-project python scripts/release.py --check-version --expect-tag "${GITHUB_REF_NAME}"

  build-frontend:
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: |
          npm ci
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  build-desktop:
    needs: build-frontend
    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --extra desktop
      - run: uv run pyinstaller desktop/learnedleague.spec --noconfirm --clean

      - name: Package macOS DMG
        if: matrix.platform == 'macos'
        run: |
          uv run --no-project python scripts/release.py --package-dmg-only "${GITHUB_REF_NAME}"

      - name: Package Windows ZIP
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist/LearnedLeague/* -DestinationPath dist/LearnedLeague-Windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: |
            dist/*.dmg
            dist/*.dmg.sha256
            dist/LearnedLeague-Windows.zip

  publish-docker:
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/ll
          tags: |
            type=ref,event=tag
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  publish-release:
    needs: [build-desktop, publish-docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release_assets
      - name: Extract release notes from changelog
        id: notes
        run: |
          uv run --no-project python scripts/release.py --extract-notes "${GITHUB_REF_NAME}" > release_notes.md
          if [[ -s release_notes.md ]]; then
            echo "has_notes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_notes=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: softprops/action-gh-release@v2
        if: steps.notes.outputs.has_notes == 'true'
        with:
          name: "LearnedLeague ${{ github.ref_name }}"
          body_path: release_notes.md
          files: release_assets/*
      - uses: softprops/action-gh-release@v2
        if: steps.notes.outputs.has_notes != 'true'
        with:
          name: "LearnedLeague ${{ github.ref_name }}"
          generate_release_notes: true
          files: release_assets/*
