services:
  learnedleague:
    image: ${LL_IMAGE:-learnedleague-tool:local}
    build: .
    container_name: learnedleague-tool
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    env_file:
      - .env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ll_data:/data

  caddy:
    image: caddy:2-alpine
    container_name: learnedleague-caddy
    profiles:
      - https
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - learnedleague

volumes:
  ll_data:
  caddy_data:
  caddy_config:
